app:
  rag:
    top-k: 3
    similarity-threshold: 0.5
  models:
    smart: ${OLLAMA_SMART_MODEL:qwen2.5:14b}
    fast: ${OLLAMA_FAST_MODEL:llama3.2:3b}
    bielik: ${OLLAMA_BIELIK_MODEL:SpeakLeash/bielik-11b-v3.0-instruct:Q4_K_M}
    gemini: ${GEMINI_CHAT_MODEL:gemini-2.0-flash}
    openai: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

server:
  port: 8081

spring:
  application:
    name: bigrun-coach
  config:
    import: optional:file:.env
  jpa:
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  ai:
    vectorstore:
      pgvector:
        dimensions: 768
        initialize-schema: false
    ollama:
      enabled: ${OLLAMA_ENABLED:true}
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_SMART_MODEL:qwen2.5:14b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    google:
      genai:
        enabled: ${GEMINI_ENABLED:false}
        api-key: ${GEMINI_API_KEY:not-configured}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.0-flash}
        embedding:
          options:
            model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    openai:
      enabled: ${OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
